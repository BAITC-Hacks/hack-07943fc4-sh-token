[project]
name = "orion-money-graph"
version = "0.1.0"
description = "Explainable transaction-graph analysis pipeline for HackAlem AI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "networkx>=3.4,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<26",
  "scipy>=1.14,<2",
]

[project.scripts]
money-graph = "money_graph.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/money_graph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
